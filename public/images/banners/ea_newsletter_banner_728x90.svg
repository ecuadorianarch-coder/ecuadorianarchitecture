<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="100%" height="100%">
  <defs>
    <linearGradient id="eaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c0e" />
      <stop offset="100%" stop-color="#14171b" />
    </linearGradient>
    <linearGradient id="eaAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="728" height="90" fill="url(#eaBgGrad)" />
  <rect x="0.5" y="0.5" width="727" height="89" fill="none" stroke="#ffffff" stroke-opacity="0.2" />

  <!-- Architectural Grid Lines -->
  <line x1="175" y1="10" x2="175" y2="80" stroke="#ffffff" stroke-opacity="0.12" />
  <line x1="565" y1="10" x2="565" y2="80" stroke="#ffffff" stroke-opacity="0.12" />

  <!-- Brand Mark: ECUADORIAN ARCHITECTURE -->
  <g transform="translate(24, 20)">
    <text x="0" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="#ffffff">EA</text>
    <text x="2" y="44" font-family="'Courier New', monospace" font-size="8" font-weight="700" letter-spacing="2.5" fill="#ffffff" fill-opacity="0.7">ECUADORIAN ARCH</text>
  </g>

  <!-- Newsletter Invitation Highlight -->
  <g transform="translate(198, 22)">
    <text x="0" y="14" font-family="'Courier New', monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.75">COMUNIDAD EDITORIAL // SIN CONTENIDO DE RELLENO</text>
    <text x="0" y="34" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5" fill="#ffffff">SUSCRÍBETE A NUESTRO NEWSLETTER</text>
    <text x="0" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#ffffff" fill-opacity="0.65">Investigaciones, proyectos, procesos de obra y críticas en tu bandeja.</text>
  </g>

  <!-- Architectural Accent -->
  <line x1="198" y1="56" x2="540" y2="56" stroke="url(#eaAccentLine)" stroke-width="1.2" />

  <!-- Graphic Call To Action Button -->
  <g transform="translate(580, 26)">
    <rect width="128" height="38" rx="3" fill="#ffffff" stroke="#ffffff" />
    <text x="14" y="23" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#0a0c0e">SUSCRIBIRME</text>
    <path d="M 104 16 L 111 19 L 104 22" fill="none" stroke="#0a0c0e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Discreet Label -->
  <text x="716" y="12" text-anchor="end" font-family="'Courier New', monospace" font-size="7" font-weight="700" letter-spacing="1" fill="#ffffff" fill-opacity="0.35">EDITORIAL</text>
</svg>
