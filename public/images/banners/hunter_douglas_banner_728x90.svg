<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="100%" height="100%">
  <defs>
    <linearGradient id="hdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1318" />
      <stop offset="100%" stop-color="#182029" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="728" height="90" fill="url(#hdGrad)" />
  <rect x="0.5" y="0.5" width="727" height="89" fill="none" stroke="#ffffff" stroke-opacity="0.15" />

  <!-- Subtle Architectural Grid Accent -->
  <line x1="210" y1="12" x2="210" y2="78" stroke="#ffffff" stroke-opacity="0.1" />
  <line x1="560" y1="12" x2="560" y2="78" stroke="#ffffff" stroke-opacity="0.1" />

  <!-- Brand Mark: Hunter Douglas -->
  <g transform="translate(24, 22)">
    <text x="0" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1" fill="#ffffff">HunterDouglas</text>
    <text x="0" y="44" font-family="'Courier New', monospace" font-size="8.5" font-weight="700" letter-spacing="2.5" fill="#38bdf8">ARCHITECTURAL</text>
  </g>

  <!-- Product System Highlight -->
  <g transform="translate(230, 24)">
    <text x="0" y="15" font-family="'Courier New', monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#38bdf8">ENVOLVENTES // FACHADAS PARAMÉTRICAS</text>
    <text x="0" y="34" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5" fill="#ffffff">CELOSÍAS AEROBRISE Y CONTROL SOLAR PASIVO</text>
    <text x="0" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#ffffff" fill-opacity="0.6">Aluminio arquitectónico termolacado • Rendimiento bioclimático andino</text>
  </g>

  <!-- Graphic Façade Louver Lines -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4">
    <line x1="230" y1="56" x2="530" y2="56" />
    <line x1="235" y1="59" x2="525" y2="59" stroke-opacity="0.2" />
  </g>

  <!-- Graphic Call To Action Button (Baked into image artwork) -->
  <g transform="translate(580, 26)">
    <rect width="122" height="38" rx="2" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.5" />
    <text x="12" y="23" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#ffffff">MUESTRARIO</text>
    <path d="M 98 16 L 105 16 M 105 16 L 105 23 M 105 16 L 96 25" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Discreet AD Label -->
  <text x="716" y="12" text-anchor="end" font-family="'Courier New', monospace" font-size="7" font-weight="700" letter-spacing="1" fill="#ffffff" fill-opacity="0.3">PUBLICIDAD</text>
</svg>
